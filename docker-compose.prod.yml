services:
  db:
    image: postgres:16
    container_name: crm-postgres-prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: ghcr.io/rahma-begag-19/fastapi-docker-cicd/backend:latest
    container_name: crm-backend-prod
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES}
    depends_on:
      db:
          condition: service_healthy
    ports:
      - "8080:8000"

  frontend:
    image: ghcr.io/rahma-begag-19/fastapi-docker-cicd/frontend:latest
    container_name: crm-frontend-prod
    ports:
      - "5500:80"
    depends_on:
      - backend

volumes:
  postgres_data_prod: