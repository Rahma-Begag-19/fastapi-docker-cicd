<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MyCRM Dashboard</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Inter,
            -apple-system,
            BlinkMacSystemFont,
            "Segoe UI",
            sans-serif;

            min-height: 100vh;

            background: linear-gradient(
                    135deg,
                    #eef2ff,
                    #f8fafc,
                    #eff6ff
            );

            color: #1e293b;
        }


        /* ==========================================
           NAVBAR
        ========================================== */

        .navbar {
            height: 72px;

            background: rgba(255, 255, 255, 0.9);

            backdrop-filter: blur(12px);

            border-bottom: 1px solid #e2e8f0;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 40px;

            position: sticky;
            top: 0;
            z-index: 10;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;

            font-size: 20px;
            font-weight: 700;

            color: #4f46e5;
        }

        .logo-icon {
            width: 36px;
            height: 36px;

            border-radius: 10px;

            display: flex;
            align-items: center;
            justify-content: center;

            color: white;

            background: linear-gradient(
                    135deg,
                    #6366f1,
                    #3b82f6
            );
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .user-name {
            color: #64748b;
            font-size: 14px;
        }

        .logout-button {
            border: none;

            background: #f1f5f9;

            color: #475569;

            padding: 9px 16px;

            border-radius: 8px;

            font-weight: 600;

            cursor: pointer;

            transition: 0.2s;
        }

        .logout-button:hover {
            background: #fee2e2;
            color: #dc2626;
        }


        /* ==========================================
           MAIN
        ========================================== */

        .container {
            max-width: 1100px;

            margin: auto;

            padding: 45px 25px 60px;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;

            margin-bottom: 30px;
        }

        .page-header h1 {
            font-size: 32px;

            color: #0f172a;

            margin-bottom: 7px;
        }

        .page-header p {
            color: #64748b;

            font-size: 15px;
        }


        /* ==========================================
           BUTTONS
        ========================================== */

        .primary-button {
            border: none;

            background: linear-gradient(
                    135deg,
                    #6366f1,
                    #3b82f6
            );

            color: white;

            padding: 11px 18px;

            border-radius: 9px;

            font-weight: 600;

            cursor: pointer;

            box-shadow: 0 5px 15px rgba(79, 70, 229, 0.2);

            transition: 0.2s;
        }

        .primary-button:hover {
            transform: translateY(-1px);

            box-shadow: 0 8px 20px rgba(79, 70, 229, 0.3);
        }


        /* ==========================================
           STATS
        ========================================== */

        .stats {
            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 18px;

            margin-bottom: 38px;
        }

        .stat-card {
            background: white;

            border: 1px solid #e2e8f0;

            border-radius: 14px;

            padding: 22px;

            box-shadow: 0 8px 25px rgba(15, 23, 42, 0.05);
        }

        .stat-label {
            color: #64748b;

            font-size: 13px;

            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 27px;

            font-weight: 700;

            color: #0f172a;
        }


        /* ==========================================
           SECTION HEADER
        ========================================== */

        .section-header {
            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 18px;
        }

        .section-header h2 {
            font-size: 20px;

            color: #0f172a;
        }

        .contact-count {
            font-size: 13px;

            color: #64748b;
        }


        /* ==========================================
           CONTACT GRID
        ========================================== */

        #contacts {
            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 18px;
        }

        .contact {
            background: white;

            border: 1px solid #e2e8f0;

            border-radius: 14px;

            padding: 22px;

            box-shadow: 0 8px 25px rgba(15, 23, 42, 0.05);

            transition: 0.2s;
        }

        .contact:hover {
            transform: translateY(-3px);

            border-color: #c7d2fe;

            box-shadow: 0 14px 30px rgba(79, 70, 229, 0.1);
        }

        .contact-top {
            display: flex;

            align-items: center;

            gap: 14px;

            margin-bottom: 18px;
        }

        .contact-avatar {
            width: 46px;
            height: 46px;

            border-radius: 50%;

            display: flex;

            align-items: center;
            justify-content: center;

            background: linear-gradient(
                    135deg,
                    #6366f1,
                    #3b82f6
            );

            color: white;

            font-weight: 700;
        }

        .contact-name {
            font-size: 16px;

            font-weight: 700;

            color: #0f172a;
        }

        .contact-company {
            margin-top: 3px;

            font-size: 13px;

            color: #64748b;
        }

        .contact-info {
            display: flex;

            flex-direction: column;

            gap: 8px;

            margin-bottom: 18px;
        }

        .contact-info div {
            font-size: 14px;

            color: #475569;
        }

        .contact-notes {
            font-size: 13px;

            color: #64748b;

            padding-top: 12px;

            border-top: 1px solid #f1f5f9;

            margin-bottom: 18px;
        }


        /* ==========================================
           CONTACT ACTION BUTTONS
        ========================================== */

        .contact-actions,
        .deal-actions {
            display: flex;

            gap: 8px;
        }

        .edit-button,
        .delete-button {
            border: none;

            padding: 8px 13px;

            border-radius: 7px;

            font-size: 13px;

            font-weight: 600;

            cursor: pointer;

            transition: 0.2s;
        }

        .edit-button {
            background: #eef2ff;

            color: #4f46e5;
        }

        .edit-button:hover {
            background: #e0e7ff;
        }

        .delete-button {
            background: #fef2f2;

            color: #dc2626;
        }

        .delete-button:hover {
            background: #fee2e2;
        }


        /* ==========================================
           DEALS
        ========================================== */

        .deals-section {
            margin-top: 42px;
        }

        #deals {
            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 18px;
        }

        .deal {
            background: white;

            border: 1px solid #e2e8f0;

            border-radius: 14px;

            padding: 22px;

            box-shadow: 0 8px 25px rgba(15, 23, 42, 0.05);

            transition: 0.2s;
        }

        .deal:hover {
            transform: translateY(-3px);

            border-color: #c7d2fe;

            box-shadow: 0 14px 30px rgba(79, 70, 229, 0.1);
        }

        .deal-top {
            display: flex;

            align-items: center;

            gap: 14px;

            margin-bottom: 18px;
        }

        .deal-icon {
            width: 46px;
            height: 46px;

            border-radius: 12px;

            display: flex;

            align-items: center;
            justify-content: center;

            background: linear-gradient(
                    135deg,
                    #6366f1,
                    #3b82f6
            );

            color: white;

            font-size: 20px;
        }

        .deal-title {
            font-size: 16px;

            font-weight: 700;

            color: #0f172a;
        }

        .deal-contact {
            margin-top: 3px;

            font-size: 13px;

            color: #64748b;
        }

        .deal-info {
            display: flex;

            flex-direction: column;

            gap: 8px;

            margin-bottom: 18px;
        }

        .deal-value {
            font-size: 22px;

            font-weight: 700;

            color: #0f172a;
        }

        .deal-status {
            display: inline-block;

            width: fit-content;

            padding: 5px 10px;

            border-radius: 999px;

            font-size: 12px;

            font-weight: 600;
        }

        .deal-status.open {
            background: #eef2ff;

            color: #4f46e5;
        }

        .deal-status.won {
            background: #dcfce7;

            color: #16a34a;
        }

        .deal-status.lost {
            background: #fee2e2;

            color: #dc2626;
        }


        /* ==========================================
           EMPTY STATE
        ========================================== */

        .empty-state {
            grid-column: 1 / -1;

            text-align: center;

            padding: 60px 20px;

            background: white;

            border: 1px dashed #cbd5e1;

            border-radius: 14px;

            color: #64748b;
        }

        .empty-icon {
            font-size: 35px;

            margin-bottom: 12px;
        }

        .empty-state h3 {
            color: #334155;

            margin-bottom: 6px;
        }


        /* ==========================================
           MODAL
        ========================================== */

        .modal-overlay {
            position: fixed;

            inset: 0;

            background: rgba(15, 23, 42, 0.45);

            display: none;

            align-items: center;
            justify-content: center;

            padding: 20px;

            z-index: 100;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            width: 100%;

            max-width: 500px;

            background: white;

            border-radius: 16px;

            padding: 28px;

            box-shadow: 0 25px 60px rgba(15, 23, 42, 0.2);
        }

        .modal-header {
            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 22px;
        }

        .modal-header h2 {
            color: #0f172a;

            font-size: 21px;
        }

        .close-button {
            border: none;

            background: #f1f5f9;

            width: 32px;
            height: 32px;

            border-radius: 50%;

            cursor: pointer;

            font-size: 18px;

            color: #64748b;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;

            font-size: 13px;

            font-weight: 600;

            color: #475569;

            margin-bottom: 6px;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;

            border: 1px solid #cbd5e1;

            border-radius: 8px;

            padding: 10px 12px;

            font-family: inherit;

            font-size: 14px;

            outline: none;

            transition: 0.2s;

            background: white;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            border-color: #6366f1;

            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .form-group textarea {
            resize: vertical;

            min-height: 80px;
        }

        .modal-actions {
            display: flex;

            justify-content: flex-end;

            gap: 10px;

            margin-top: 22px;
        }

        .cancel-button {
            border: none;

            background: #f1f5f9;

            color: #475569;

            padding: 10px 16px;

            border-radius: 8px;

            cursor: pointer;

            font-weight: 600;
        }


        /* ==========================================
           RESPONSIVE
        ========================================== */

        @media (max-width: 750px) {

            .navbar {
                padding: 0 20px;
            }

            .user-name {
                display: none;
            }

            .container {
                padding: 30px 18px 50px;
            }

            .page-header {
                align-items: flex-start;

                flex-direction: column;

                gap: 18px;
            }

            .stats {
                grid-template-columns: 1fr;
            }

            #contacts,
            #deals {
                grid-template-columns: 1fr;
            }
        }

    </style>
</head>


<body>


<!-- ==========================================
     NAVBAR
========================================== -->

<nav class="navbar">

    <div class="logo">

        <div class="logo-icon">
            C
        </div>

        MyCRM

    </div>


    <div class="nav-right">

            <span
                    class="user-name"
                    id="welcome"
            >
                Loading...
            </span>

        <button
                class="logout-button"
                id="logoutButton"
        >
            Logout
        </button>

    </div>

</nav>


<!-- ==========================================
     MAIN
========================================== -->

<main class="container">


    <!-- PAGE HEADER -->

    <div class="page-header">

        <div>

            <h1>
                Dashboard
            </h1>

            <p>
                Manage your contacts and relationships.
            </p>

        </div>


    </div>


    <!-- ==========================================
         STATS
    ========================================== -->

    <section class="stats">

        <div class="stat-card">

            <div class="stat-label">
                Total Contacts
            </div>

            <div
                    class="stat-value"
                    id="contactCount"
            >
                —
            </div>

        </div>


        <div class="stat-card">

            <div class="stat-label">
                Total Deals
            </div>

            <div
                    class="stat-value"
                    id="dealCount"
            >
                —
            </div>

        </div>


        <div class="stat-card">

            <div class="stat-label">
                Pipeline Value
            </div>

            <div
                    class="stat-value"
                    id="pipelineValue"
            >
                —
            </div>

        </div>


        <div class="stat-card">

            <div class="stat-label">
                Account
            </div>

            <div
                    class="stat-value"
                    id="accountName"
                    style="font-size: 18px;"
            >
                —
            </div>

        </div>

    </section>


    <!-- ==========================================
         CONTACTS
    ========================================== -->

    <section>

        <div class="section-header">

            <h2>
                My Contacts
            </h2>
            <span
                    class="contact-count"
                    id="contactLabel"
            >
                </span>
            <button
                    class="primary-button"
                    id="addContactButton"
            >
                + Add Contact
            </button>


        </div>


        <div id="contacts">

            <div class="empty-state">

                <div class="empty-icon">
                    ⏳
                </div>

                <h3>
                    Loading contacts
                </h3>

                <p>
                    Please wait...
                </p>

            </div>

        </div>

    </section>


    <!-- ==========================================
         DEALS
    ========================================== -->

    <section class="deals-section">

        <div class="section-header">

            <h2>
                My Deals
            </h2>

            <button
                    class="primary-button"
                    id="addDealButton"
            >
                + Add Deal
            </button>

        </div>


        <div id="deals">

            <div class="empty-state">

                <div class="empty-icon">
                    ⏳
                </div>

                <h3>
                    Loading deals
                </h3>

                <p>
                    Please wait...
                </p>

            </div>

        </div>

    </section>


</main>


<!-- ==========================================
     CONTACT MODAL
========================================== -->

<div
        class="modal-overlay"
        id="modalOverlay"
>

    <div class="modal">

        <div class="modal-header">

            <h2 id="modalTitle">
                Add Contact
            </h2>

            <button
                    class="close-button"
                    id="closeModalButton"
            >
                ×
            </button>

        </div>


        <form id="contactForm">


            <div class="form-group">

                <label for="contactName">
                    Name
                </label>

                <input
                        type="text"

                >

            </div>


            <div class="form-group">

                <label for="contactEmail">

                </label>

                <input
                        type="email"

                >

            </div>


            <div class="form-group">

                <label for="contactPhone">
                    Phone
                </label>

                <input
                        type="text"
                        id="contactPhone"
                >

            </div>


            <div class="form-group">

                <label for="contactCompany">
                    Company
                </label>

                <input
                        type="text"

            </div>


            <div class="form-group">

                <label for="contactNotes">

                <textarea

                ></textarea>

            </div>

                <button

                </button>


                <button

                >
                    Save Contact
                </button>

            </div>

        </form>

    </div>

</div>


<!-- ==========================================
     DEAL MODAL
========================================== -->

<div
        class="modal-overlay"
        id="dealModalOverlay"
>

    <div class="modal">

        <div class="modal-header">

            <h2 id="dealModalTitle">
                Add Deal
            </h2>

            <button
                    class="close-button"
                    id="closeDealModalButton"
                    type="button"
            >
                ×
            </button>

        </div>


        <form id="dealForm">


            <div class="form-group">

                <label for="dealTitle">
                    Deal Title
                </label>

                <input
                        type="text"
                        id="dealTitle"
                        placeholder="e.g. Premium Plan"
                        required
                >

            </div>


            <div class="form-group">

                <label for="dealValue">
                    Value
                </label>

                <input
                        type="number"
                        id="dealValue"
                        min="0"
                        step="0.01"

            </div>


            <div class="form-group">

                <label for="dealStatus">
                    Status
                </label>

                <select id="dealStatus">

                    <option value="open">
                        Open
                    </option>

                    <option value="won">
                        Won
                    </option>

                    <option value="lost">
                        Lost
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label for="dealContact">
                    Contact
                </label>

                <select
                        id="dealContact"
                        required
                >

                    <option value="">

                    </option>

                </select>

            </div>


            <div class="modal-actions">

                <button
                        type="button"
                        class="cancel-button"
                        id="cancelDealButton"
                >
                    Cancel
                </button>

                        type="submit"
                        class="primary-button"
                >
                    Save Deal
                </button>

            </div>

        </form>

    </div>

</div>


<!-- ==========================================
     JAVASCRIPT
========================================== -->

<script>


    /* ==========================================
       AUTHENTICATION
    ========================================== */

    const token =
        localStorage.getItem("access_token");


    if (!token) {

        window.location.href =
            "login.html";

    }


    /* ==========================================
       DOM ELEMENTS
    ========================================== */

    const modalOverlay =
        document.getElementById(
            "modalOverlay"
        );

    const contactForm =
        document.getElementById(
            "contactForm"
        );

    const modalTitle =
        document.getElementById(
            "modalTitle"
        );


    const dealModalOverlay =
        document.getElementById(
            "dealModalOverlay"
        );

    const dealForm =
        document.getElementById(
            "dealForm"
        );

    const dealModalTitle =
        document.getElementById(
            "dealModalTitle"
        );


    let editingContactId = null;

    let editingDealId = null;


    /* ==========================================
       API HELPER
    ========================================== */

    async function apiRequest(
        url,
        options = {}
    ) {

        const response =
            await fetch(
                url,
                {
                    ...options,

                    headers: {

                        "Content-Type":
                            "application/json",

                        "Authorization":
                            `Bearer ${token}`,

                        ...(options.headers || {})

                    }

                }
            );


        if (response.status === 401) {

            localStorage.removeItem(
                "access_token"
            );

            window.location.href =
                "login.html";

            return null;

        }


        return response;

    }


    /* ==========================================
       LOAD USER
    ========================================== */

    async function loadUser() {

        const response =
            await apiRequest(
                "http://127.0.0.1:8080/auth/me"
            );


        if (!response) {
            return;
        }


        if (!response.ok) {

            console.error(
                "Could not load user."
            );

            return;

        }


        const user =
            await response.json();


        document.getElementById(
            "welcome"
        ).textContent =
            `Welcome, ${user.name}`;


        document.getElementById(
            "accountName"
        ).textContent =
            user.name;

    }


    /* ==========================================
       LOAD CONTACTS
    ========================================== */

    async function loadContacts() {

        const contactsContainer =
            document.getElementById(
                "contacts"
            );


        const response =
            await apiRequest(
                "http://127.0.0.1:8080/contacts/"
            );


        if (!response) {
            return;
        }


        if (!response.ok) {

            contactsContainer.innerHTML = `

                    <div class="empty-state">

                        <div class="empty-icon">
                            ⚠️
                        </div>

                        <h3>
                            Could not load contacts
                        </h3>

                        <p>
                            Please try again.
                        </p>

                    </div>

                `;

            return;

        }


        const contacts =
            await response.json();


        document.getElementById(
            "contactCount"
        ).textContent =
            contacts.length;


        document.getElementById(
            "contactLabel"
        ).textContent =
            `${contacts.length} contact${
                contacts.length === 1
                    ? ""
                    : "s"
            }`;


        contactsContainer.innerHTML = "";


        if (contacts.length === 0) {

            contactsContainer.innerHTML = `

                    <div class="empty-state">

                        <div class="empty-icon">
                            👥
                        </div>

                        <h3>
                            No contacts yet
                        </h3>

                        <p>
                            Add your first contact to get started.
                        </p>

                    </div>

                `;

            return;

        }


        contacts.forEach(contact => {

            const card =
                document.createElement(
                    "div"
                );

            card.className =
                "contact";


            const top =
                document.createElement(
                    "div"
                );

            top.className =
                "contact-top";


            const avatar =
                document.createElement(
                    "div"
                );

            avatar.className =
                "contact-avatar";


            const initials =
                contact.name
                    .split(" ")
                    .map(
                        name =>
                            name.charAt(0)
                    )
                    .join("")
                    .substring(0, 2)
                    .toUpperCase();


            avatar.textContent =
                initials;


            const titleContainer =
                document.createElement(
                    "div"
                );


            const name =
                document.createElement(
                    "div"
                );

            name.className =
                "contact-name";

            name.textContent =
                contact.name;


            const company =
                document.createElement(
                    "div"
                );

            company.className =
                "contact-company";

            company.textContent =
                contact.company ||
                "No company";


            titleContainer.appendChild(
                name
            );

            titleContainer.appendChild(
                company
            );


            top.appendChild(avatar);

            top.appendChild(
                titleContainer
            );


            const info =
                document.createElement(
                    "div"
                );

            info.className =
                "contact-info";


            const email =
                document.createElement(
                    "div"
                );

            email.textContent =
                `✉ ${contact.email || "No email"}`;


            const phone =
                document.createElement(
                    "div"
                );

            phone.textContent =
                `☎ ${contact.phone || "No phone"}`;


            info.appendChild(email);

            info.appendChild(phone);


            const notes =
                document.createElement(
                    "div"
                );

            notes.className =
                "contact-notes";

            notes.textContent =
                contact.notes ||
                "No notes";


            const actions =
                document.createElement(
                    "div"
                );

            actions.className =
                "contact-actions";


            const editButton =
                document.createElement(
                    "button"
                );

            editButton.className =
                "edit-button";

            editButton.textContent =
                "Edit";


            editButton.addEventListener(
                "click",
                () => {

                    openEditModal(
                        contact
                    );

                }
            );


            const deleteButton =
                document.createElement(
                    "button"
                );

            deleteButton.className =
                "delete-button";

            deleteButton.textContent =
                "Delete";


            deleteButton.addEventListener(
                "click",
                () => {

                    deleteContact(
                        contact.id
                    );

                }
            );


            actions.appendChild(
                editButton
            );

            actions.appendChild(
                deleteButton
            );


            card.appendChild(top);

            card.appendChild(info);

            card.appendChild(notes);

            card.appendChild(actions);


            contactsContainer.appendChild(
                card
            );

        });

    }


    /* ==========================================
       OPEN CREATE CONTACT MODAL
    ========================================== */

    function openCreateModal() {

        editingContactId = null;


        modalTitle.textContent =
            "Add Contact";


        contactForm.reset();


        modalOverlay.classList.add(
            "active"
        );

    }


    /* ==========================================
       OPEN EDIT CONTACT MODAL
    ========================================== */

    function openEditModal(contact) {

        editingContactId =
            contact.id;


        modalTitle.textContent =
            "Edit Contact";


        document.getElementById(
            "contactName"
        ).value =
            contact.name || "";


        document.getElementById(
            "contactEmail"
        ).value =
            contact.email || "";


        document.getElementById(
            "contactPhone"
        ).value =
            contact.phone || "";


        document.getElementById(
            "contactCompany"
        ).value =
            contact.company || "";


        document.getElementById(
            "contactNotes"
        ).value =
            contact.notes || "";


        modalOverlay.classList.add(
            "active"
        );

    }


    /* ==========================================
       CLOSE CONTACT MODAL
    ========================================== */

    function closeModal() {

        modalOverlay.classList.remove(
            "active"
        );

        contactForm.reset();

        editingContactId = null;

    }


    /* ==========================================
       CREATE / UPDATE CONTACT
    ========================================== */

    contactForm.addEventListener(
        "submit",
        async function (event) {

            event.preventDefault();


            const contactData = {

                name:
                    document.getElementById(
                        "contactName"
                    ).value.trim(),

                email:
                    document.getElementById(
                        "contactEmail"
                    ).value.trim() || null,

                phone:
                    document.getElementById(
                        "contactPhone"
                    ).value.trim() || null,

                company:
                    document.getElementById(
                        "contactCompany"
                    ).value.trim() || null,

                notes:
                    document.getElementById(
                        "contactNotes"
                    ).value.trim() || null

            };


            let url =
                "http://127.0.0.1:8080/contacts/";

            let method =
                "POST";


            if (
                editingContactId !== null
            ) {

                url =
                    `http://127.0.0.1:8080/contacts/${editingContactId}`;

                method =
                    "PUT";

            }


            const response =
                await apiRequest(
                    url,
                    {
                        method: method,

                        body:
                            JSON.stringify(
                                contactData
                            )
                    }
                );


            if (!response) {
                return;
            }


            if (!response.ok) {

                let errorMessage =
                    "Something went wrong.";


                try {

                    const error =
                        await response.json();

                    errorMessage =
                        error.detail ||
                        errorMessage;

                } catch (error) {

                    // Ignore JSON parsing error.

                }


                alert(errorMessage);

                return;

            }


            closeModal();


            await loadContacts();

            await loadDeals();

        }
    );


    /* ==========================================
       DELETE CONTACT
    ========================================== */

    async function deleteContact(
        contactId
    ) {

        const confirmed =
            confirm(
                "Are you sure you want to delete this contact?"
            );


        if (!confirmed) {
            return;
        }


        const response =
            await apiRequest(
                `http://127.0.0.1:8080/contacts/${contactId}`,
                {
                    method: "DELETE"
                }
            );


        if (!response) {
            return;
        }


        if (!response.ok) {

            let errorMessage =
                "Could not delete contact.";


            try {

                const error =
                    await response.json();

                errorMessage =
                    error.detail ||
                    errorMessage;

            } catch (error) {

                // Ignore JSON parsing error.

            }


            alert(errorMessage);

            return;

        }


        await loadContacts();

        await loadDeals();

    }


    /* ==========================================
       LOAD DEALS
    ========================================== */

    async function loadDeals() {

        const dealsContainer =
            document.getElementById(
                "deals"
            );


        const response =
            await apiRequest(
                "http://127.0.0.1:8080/deals/"
            );


        if (!response) {
            return;
        }


        if (!response.ok) {

            dealsContainer.innerHTML = `

                    <div class="empty-state">

                        <div class="empty-icon">
                            ⚠️
                        </div>

                        <h3>
                            Could not load deals
                        </h3>

                        <p>
                            Please try again.
                        </p>

                    </div>

                `;

            return;

        }


        const deals =
            await response.json();


        document.getElementById(
            "dealCount"
        ).textContent =
            deals.length;


        const pipeline =
            deals.reduce(
                (total, deal) => {

                    if (
                        deal.status === "open"
                    ) {
                        return total +
                            (Number(deal.value) || 0);
                    }

                    return total;

                },
                0
            );


        document.getElementById(
            "pipelineValue"
        ).textContent =
            `$${pipeline.toLocaleString()}`;


        dealsContainer.innerHTML = "";


        if (deals.length === 0) {

            dealsContainer.innerHTML = `

                    <div class="empty-state">

                        <div class="empty-icon">
                            💼
                        </div>

                        <h3>
                            No deals yet
                        </h3>

                        <p>
                            Create your first deal to start tracking sales.
                        </p>

                    </div>

                `;

            return;

        }


        /*
         * Get contacts so we can display
         * the contact name instead of only
         * the contact_id.
         */

        const contactsResponse =
            await apiRequest(
                "http://127.0.0.1:8080/contacts/"
            );


        let contacts = [];


        if (
            contactsResponse &&
            contactsResponse.ok
        ) {

            contacts =
                await contactsResponse.json();

        }


        deals.forEach(deal => {

            const contact =
                contacts.find(
                    contact =>
                        contact.id ===
                        deal.contact_id
                );


            const card =
                document.createElement(
                    "div"
                );

            card.className =
                "deal";


            const top =
                document.createElement(
                    "div"
                );

            top.className =
                "deal-top";


            const icon =
                document.createElement(
                    "div"
                );

            icon.className =
                "deal-icon";

            icon.textContent =
                "💼";


            const titleContainer =
                document.createElement(
                    "div"
                );


            const title =
                document.createElement(
                    "div"
                );

            title.className =
                "deal-title";

            title.textContent =
                deal.title;


            const contactName =
                document.createElement(
                    "div"
                );

            contactName.className =
                "deal-contact";

            contactName.textContent =
                contact
                    ? contact.name
                    : "Unknown contact";


            titleContainer.appendChild(
                title
            );

            titleContainer.appendChild(
                contactName
            );


            top.appendChild(icon);

            top.appendChild(
                titleContainer
            );


            const info =
                document.createElement(
                    "div"
                );

            info.className =
                "deal-info";


            const value =
                document.createElement(
                    "div"
                );

            value.className =
                "deal-value";

            value.textContent =
                deal.value !== null &&
                deal.value !== undefined
                    ? `$${Number(deal.value).toLocaleString()}`
                    : "$0";


            const status =
                document.createElement(
                    "span"
                );

            status.className =
                `deal-status ${deal.status}`;

            status.textContent =
                deal.status
                    .charAt(0)
                    .toUpperCase() +
                deal.status.slice(1);


            info.appendChild(value);

            info.appendChild(status);


            const actions =
                document.createElement(
                    "div"
                );

            actions.className =
                "deal-actions";


            const editButton =
                document.createElement(
                    "button"
                );

            editButton.className =
                "edit-button";

            editButton.textContent =
                "Edit";


            editButton.addEventListener(
                "click",
                () => {

                    openEditDealModal(
                        deal
                    );

                }
            );


            const deleteButton =
                document.createElement(
                    "button"
                );

            deleteButton.className =
                "delete-button";

            deleteButton.textContent =
                "Delete";


            deleteButton.addEventListener(
                "click",
                () => {

                    deleteDeal(
                        deal.id
                    );

                }
            );


            actions.appendChild(
                editButton
            );

            actions.appendChild(
                deleteButton
            );


            card.appendChild(top);

            card.appendChild(info);

            card.appendChild(actions);


            dealsContainer.appendChild(
                card
            );

        });

    }


    /* ==========================================
       LOAD CONTACTS INTO DEAL SELECT
    ========================================== */

    async function loadContactOptions(
        selectedContactId = null
    ) {

        const select =
            document.getElementById(
                "dealContact"
            );


        const response =
            await apiRequest(
                "http://127.0.0.1:8080/contacts/"
            );


        if (!response || !response.ok) {
            return;
        }


        const contacts =
            await response.json();


        select.innerHTML = "";


        const defaultOption =
            document.createElement(
                "option"
            );

        defaultOption.value = "";

        defaultOption.textContent =
            "Select a contact";


        select.appendChild(
            defaultOption
        );


        contacts.forEach(contact => {

            const option =
                document.createElement(
                    "option"
                );

            option.value =
                contact.id;

            option.textContent =
                contact.name;


            if (
                selectedContactId !== null &&
                contact.id ===
                selectedContactId
            ) {

                option.selected =
                    true;

            }


            select.appendChild(
                option
            );

        });

    }


    /* ==========================================
       OPEN CREATE DEAL MODAL
    ========================================== */

    async function openCreateDealModal() {

        editingDealId = null;


        dealModalTitle.textContent =
            "Add Deal";


        dealForm.reset();


        await loadContactOptions();


        dealModalOverlay.classList.add(
            "active"
        );

    }


    /* ==========================================
       OPEN EDIT DEAL MODAL
    ========================================== */

    async function openEditDealModal(
        deal
    ) {

        editingDealId =
            deal.id;


        dealModalTitle.textContent =
            "Edit Deal";


        document.getElementById(
            "dealTitle"
        ).value =
            deal.title || "";


        document.getElementById(
            "dealValue"
        ).value =
            deal.value ?? "";


        document.getElementById(
            "dealStatus"
        ).value =
            deal.status || "open";


        await loadContactOptions(
            deal.contact_id
        );


        dealModalOverlay.classList.add(
            "active"
        );

    }


    /* ==========================================
       CLOSE DEAL MODAL
    ========================================== */

    function closeDealModal() {

        dealModalOverlay.classList.remove(
            "active"
        );

        dealForm.reset();

        editingDealId = null;

    }


    /* ==========================================
       CREATE / UPDATE DEAL
    ========================================== */

    dealForm.addEventListener(
        "submit",
        async function (event) {

            event.preventDefault();


            const dealData = {

                title:
                    document.getElementById(
                        "dealTitle"
                    ).value.trim(),

                value:
                    document.getElementById(
                        "dealValue"
                    ).value === ""
                        ? null
                        : Number(
                            document.getElementById(
                                "dealValue"
                            ).value
                        ),

                status:
                document.getElementById(
                    "dealStatus"
                ).value,

                contact_id:
                    Number(
                        document.getElementById(
                            "dealContact"
                        ).value
                    )

            };


            if (!dealData.contact_id) {

                alert(
                    "Please select a contact."
                );

                return;

            }


            let url =
                "http://127.0.0.1:8080/deals/";

            let method =
                "POST";


            if (
                editingDealId !== null
            ) {

                url =
                    `http://127.0.0.1:8080/deals/${editingDealId}`;

                method =
                    "PUT";

            }


            const response =
                await apiRequest(
                    url,
                    {
                        method: method,

                        body:
                            JSON.stringify(
                                dealData
                            )
                    }
                );


            if (!response) {
                return;
            }


            if (!response.ok) {

                let errorMessage =
                    "Could not save deal.";


                try {

                    const error =
                        await response.json();

                    errorMessage =
                        error.detail ||
                        errorMessage;

                } catch (error) {

                    // Ignore JSON parsing error.

                }


                alert(errorMessage);

                return;

            }


            closeDealModal();


            await loadDeals();

        }
    );


    /* ==========================================
       DELETE DEAL
    ========================================== */

    async function deleteDeal(
        dealId
    ) {

        const confirmed =
            confirm(
                "Are you sure you want to delete this deal?"
            );


        if (!confirmed) {
            return;
        }


        const response =
            await apiRequest(
                `http://127.0.0.1:8080/deals/${dealId}`,
                {
                    method: "DELETE"
                }
            );


        if (!response) {
            return;
        }


        if (!response.ok) {

            let errorMessage =
                "Could not delete deal.";


            try {

                const error =
                    await response.json();

                errorMessage =
                    error.detail ||
                    errorMessage;

            } catch (error) {

                // Ignore JSON parsing error.

            }


            alert(errorMessage);

            return;

        }


        await loadDeals();

    }


    /* ==========================================
       BUTTON EVENTS
    ========================================== */

    document
        .getElementById(
            "addContactButton"
        )
        .addEventListener(
            "click",
            openCreateModal
        );


    document
        .getElementById(
            "closeModalButton"
        )
        .addEventListener(
            "click",
            closeModal
        );


    document
        .getElementById(
            "cancelButton"
        )
        .addEventListener(
            "click",
            closeModal
        );


    document
        .getElementById(
            "addDealButton"
        )
        .addEventListener(
            "click",
            openCreateDealModal
        );


    document
        .getElementById(
            "closeDealModalButton"
        )
        .addEventListener(
            "click",
            closeDealModal
        );


    document
        .getElementById(
            "cancelDealButton"
        )
        .addEventListener(
            "click",
            closeDealModal
        );


    /* ==========================================
       CLOSE MODALS WHEN CLICKING OUTSIDE
    ========================================== */

    modalOverlay.addEventListener(
        "click",
        function (event) {

            if (
                event.target ===
                modalOverlay
            ) {

                closeModal();

            }

        }
    );


    dealModalOverlay.addEventListener(
        "click",
        function (event) {

            if (
                event.target ===
                dealModalOverlay
            ) {

                closeDealModal();

            }

        }
    );


    /* ==========================================
       LOGOUT
    ========================================== */

    document
        .getElementById(
            "logoutButton"
        )
        .addEventListener(
            "click",
            function () {

                localStorage.removeItem(
                    "access_token"
                );

                window.location.href =
                    "login.html";

            }
        );


    /* ==========================================
       INITIAL LOAD
    ========================================== */

    loadUser();

    loadContacts();

    loadDeals();

</script>
