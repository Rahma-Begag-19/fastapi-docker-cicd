services:
  prometheus:
    image: prom/prometheus:latest
    container_name: monitoring-prometheus
#     restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts:/etc/prometheus/alerts:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"

  node-exporter:
    image: prom/node-exporter:latest
    container_name: monitoring-node-exporter
#     restart: unless-stopped
    command:
      - "--path.rootfs=/host"
    volumes:
      - /:/host:ro,rslave
    expose:
      - "9100"

  grafana:
    image: grafana/grafana:latest
    container_name: monitoring-grafana
#     restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

  cadvisor:
    image: ghcr.io/google/cadvisor:latest
    container_name: monitoring-cadvisor
#     restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    expose:
      - "8080"

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:latest
    container_name: monitoring-postgres-exporter
#     restart: unless-stopped
    environment:
      DATA_SOURCE_URI: "crm-postgres-prod:5432/${POSTGRES_DB}?sslmode=disable"
      DATA_SOURCE_USER: postgres_exporter
      DATA_SOURCE_PASS: ${POSTGRES_EXPORTER_PASSWORD}
    networks:
      - default
      - crm-monitoring
    expose:
      - "9187"

  alertmanager:
    image: prom/alertmanager:latest
    container_name: monitoring-alertmanager
#     restart: unless-stopped
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
      - ./alertmanager/secrets/smtp_password:/etc/alertmanager/secrets/smtp_password:ro
    ports:
      - "127.0.0.1:9093:9093"
    networks:
      - default

volumes:
  prometheus_data:
  grafana_data:
  alertmanager-data:

networks:
  default:
    name: monitoring_default
  crm-monitoring:
    external: true
    name: fastapi-docker-cicd_default