
name: CI and CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Check application
        working-directory: backend
        run: python -m compileall app

  docker-build:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        run: |
          docker build -t crm-backend-final ./backend
          docker tag crm-backend-final ghcr.io/rahma-begag-19/fastapi-docker-cicd/backend:latest
          docker tag crm-backend-final ghcr.io/rahma-begag-19/fastapi-docker-cicd/backend:${{ github.sha }}
          docker push ghcr.io/rahma-begag-19/fastapi-docker-cicd/backend:latest
          docker push ghcr.io/rahma-begag-19/fastapi-docker-cicd/backend:${{ github.sha }}

      - name: Build and push frontend image
        run: |
          docker build -t crm-frontend-final ./frontend
          docker tag crm-frontend-final ghcr.io/rahma-begag-19/fastapi-docker-cicd/frontend:latest
          docker tag crm-frontend-final ghcr.io/rahma-begag-19/fastapi-docker-cicd/frontend:${{ github.sha }}
          docker push ghcr.io/rahma-begag-19/fastapi-docker-cicd/frontend:latest
          docker push ghcr.io/rahma-begag-19/fastapi-docker-cicd/frontend:${{ github.sha }}

  deploy:
    needs: docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: self-hosted

    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate deployment configuration
        env:
          DEPLOY_DIR: /home/rahma/Downloads/Projects/github/DevOps/fastapi-docker-cicd
        run: |
          test -f "$DEPLOY_DIR/.env" || {
            echo "Deployment .env file is missing."
            exit 1
          }

          docker compose \
            --project-name fastapi-docker-cicd \
            --env-file "$DEPLOY_DIR/.env" \
            -f "$GITHUB_WORKSPACE/docker-compose.prod.yml" \
            config --quiet

      - name: Pull application images
        env:
          DEPLOY_DIR: /home/rahma/Downloads/Projects/github/DevOps/fastapi-docker-cicd
        run: |
          docker compose \
            --project-name fastapi-docker-cicd \
            --env-file "$DEPLOY_DIR/.env" \
            -f "$GITHUB_WORKSPACE/docker-compose.prod.yml" \
            pull backend frontend

      - name: Update production containers
        env:
          DEPLOY_DIR: /home/rahma/Downloads/Projects/github/DevOps/fastapi-docker-cicd
        run: |
          docker compose \
            --project-name fastapi-docker-cicd \
            --env-file "$DEPLOY_DIR/.env" \
            -f "$GITHUB_WORKSPACE/docker-compose.prod.yml" \
            up -d --no-build --pull never --remove-orphans

      - name: Verify deployment
        env:
          DEPLOY_DIR: /home/rahma/Downloads/Projects/github/DevOps/fastapi-docker-cicd
        run: |
          docker compose \
            --project-name fastapi-docker-cicd \
            --env-file "$DEPLOY_DIR/.env" \
            -f "$GITHUB_WORKSPACE/docker-compose.prod.yml" \
            ps